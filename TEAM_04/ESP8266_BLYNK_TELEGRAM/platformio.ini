[env:nodemcu]
platform = espressif8266
board = nodemcu
framework = arduino
lib_deps = 
    adafruit/DHT sensor library@^1.4.4
    adafruit/Adafruit Unified Sensor@^1.1.6
    olikraus/U8g2@^2.35.9
    blynkkk/Blynk@^1.3.2
    bblanchon/ArduinoJson@^6.21.3
    witnessmenow/UniversalTelegramBot@^1.3.0